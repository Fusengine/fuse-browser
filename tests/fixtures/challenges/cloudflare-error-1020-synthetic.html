<!DOCTYPE html>
<!-- SYNTHETIC, not a real capture. Shape taken from Cloudflare's docs, which state that error 1020 is
     "Access denied", returned with HTTP 403, rendered in the HTML body, and shows a Ray ID to the visitor:
     https://developers.cloudflare.com/support/troubleshooting/http-status-codes/cloudflare-1xxx-errors/error-1020/
     Cloudflare publishes no default-page markup, so only headings and text are modelled here. -->
<html lang="en-US">
<head><title>Access denied</title></head>
<body>
<h1>Error 1020</h1>
<h2>Access denied</h2>
<p>What happened? This website is using a security service to protect itself from online attacks.</p>
<p>Ray ID: 0000000000000000</p>
</body>
</html>
