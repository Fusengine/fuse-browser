<!DOCTYPE html>
<!-- SYNTHETIC, not a real capture. Shape taken from Cloudflare's docs: error 1015 is "You are being rate limited",
     rendered in the HTML body (HTTP 429 for rate limiting blocks), with a Ray ID:
     https://developers.cloudflare.com/support/troubleshooting/http-status-codes/cloudflare-1xxx-errors/error-1015/
     Cloudflare publishes no default-page markup, so only headings and text are modelled here. -->
<html lang="en-US">
<head><title>Error 1015</title></head>
<body>
<h1>Error 1015</h1>
<h2>You are being rate limited</h2>
<p>The owner of this website has banned you temporarily from accessing this website.</p>
<p>Cloudflare Ray ID: 0000000000000000</p>
</body>
</html>
